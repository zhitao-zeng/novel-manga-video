[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-manga-video"
version = "0.13.0"
description = "Batch novel-to-manga video production, review and repair"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/novel_manga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "scripts", ".", "experiments"]
