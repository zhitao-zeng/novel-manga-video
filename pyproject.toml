[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-manga-video"
version = "0.4.0"
description = "Novel document to consistent vertical manga-drama videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
novel-manga = "novel_manga.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_manga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
